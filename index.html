
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Welcome to ShopEase–Your Smart Shopping Partner.</h1>

    <p>Register today and receive a personalized welcome email!</p>
    <form id="registrationForm">
    <label for="name">Your Name:</label>
    <input type="text" id="name" required>
    <br><br>
    <label for="email">Your Email:</label>
    <input type="text" id="email" required>
    <p id="emailError"></p><br>

    <label for="language">Choose Your Language:</label>
    <select id="language" required>
    <option value="" disabled selected>Select your language</option>
    <option value="English">English</option>
    <option value="Tamil">Tamil</option>
</select>
    <br><br>
    <button type="submit" id="registerButton">Register</button>
    <button type="button" id="clearDataButton">
    Clear Test Data
</button>
    </form>
    <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
